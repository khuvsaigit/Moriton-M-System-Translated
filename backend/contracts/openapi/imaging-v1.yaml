openapi: 3.1.0
info: {title: Moriton Imaging API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /health/live:
    get:
      operationId: imagingLiveness
      responses: {'200': {description: Process is alive}}
  /studies/{studyId}:
    get:
      operationId: getImagingStudy
      parameters:
        - {in: path, name: studyId, required: true, schema: {type: string, format: uuid}}
      security: [{serviceSession: []}]
      responses:
        '200':
          description: Scoped study metadata; no object bytes or storage grant in this response
          content:
            application/json:
              schema:
                type: object
                required: [id, horse_id, visit_id, study_instance_uid, study_date, modality, status, version]
                properties:
                  id: {type: string, format: uuid}
                  horse_id: {type: string, format: uuid}
                  visit_id: {type: [string, 'null'], format: uuid}
                  study_instance_uid: {type: string, maxLength: 128}
                  study_date: {type: [string, 'null'], format: date}
                  modality: {type: string, maxLength: 16}
                  status: {type: string, maxLength: 32}
                  version: {type: integer, minimum: 1}
        '401': {description: Authentication required}
        '403': {description: Organization/branch scope required}
        '404': {description: Study not found in authorized scope}
components:
  securitySchemes:
    serviceSession: {type: apiKey, in: cookie, name: sessionid}
