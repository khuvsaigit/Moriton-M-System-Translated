[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["backend/services/*/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
exclude = "backend/services/.*/migrations/"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
